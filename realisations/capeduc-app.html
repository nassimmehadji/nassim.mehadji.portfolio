<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B1121">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="CAP'EDUC — Ton réseau d'animateurs dans l'Oise. Actualités, emplois, formations BAFA.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>CAP'EDUC — Animateurs Oise</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#DC2626; --primary-d:#991B1B; --primary-l:#FCA5A5;
  --accent:#2563EB; --accent-d:#1D4ED8; --accent-l:#93C5FD;
  --dark:#0B1121; --dark2:#111827; --dark3:#1F2937;
  --surface:#FFFFFF; --surface2:#F8FAFC;
  --glass:rgba(255,255,255,0.1); --glass2:rgba(255,255,255,0.05);
  --bg:#F1F5F9; --bg2:#E2E8F0;
  --text:#0F172A; --text2:#475569; --text3:#94A3B8;
  --green:#059669; --orange:#D97706; --violet:#7C3AED; --rose:#E11D48;
  --r:16px; --r2:22px; --r3:12px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
  --shadow2:0 4px 6px rgba(0,0,0,.04),0 10px 40px rgba(0,0,0,.08);
  --shadow3:0 20px 60px rgba(0,0,0,.12);
  --nav-h:70px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100dvh;overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif}
a{text-decoration:none;color:inherit}
button{font-family:'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;border:none}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:0;height:0}

/* ===== INSTALL BANNER ===== */
.install-banner{background:var(--dark);padding:14px 16px;display:flex;align-items:center;gap:12px;animation:slideD .5s var(--ease) .3s both}
.install-banner.hidden{display:none}
.install-txt{flex:1}
.install-txt strong{font-size:13px;color:#fff;display:block}
.install-txt span{font-size:11px;color:rgba(255,255,255,.4)}
.install-btn{background:var(--primary);color:#fff;border-radius:10px;padding:8px 16px;font-size:12px;font-weight:700}
.install-close{background:none;color:rgba(255,255,255,.3);font-size:20px;padding:0 4px}

/* ===== OFFLINE BAR ===== */
.offline-bar{display:none;background:var(--orange);color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:600}
body.offline .offline-bar{display:block}

/* ===== HEADER ===== */
.header{padding:52px 20px 28px;position:relative;overflow:hidden}
.header-home{background:var(--dark);position:relative}
.header-home::before{content:'';position:absolute;top:-120px;right:-60px;width:300px;height:300px;background:radial-gradient(circle,rgba(220,38,38,.18),transparent 70%);filter:blur(50px)}
.header-home::after{content:'';position:absolute;bottom:-80px;left:-60px;width:250px;height:250px;background:radial-gradient(circle,rgba(37,99,235,.12),transparent 70%);filter:blur(40px)}
.header-sub{background:linear-gradient(135deg,var(--dark),var(--dark2))}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;position:relative;z-index:1}
.header-badge{display:inline-flex;align-items:center;gap:7px;background:var(--glass);backdrop-filter:blur(16px);padding:6px 14px 6px 7px;border-radius:100px;font-size:11px;color:rgba(255,255,255,.65);font-weight:600;border:1px solid rgba(255,255,255,.06)}
.header-badge img.badge-logo{width:24px;height:24px;border-radius:7px;object-fit:cover}
.home-logo{width:88px;height:88px;border-radius:22px;object-fit:cover;box-shadow:0 8px 32px rgba(0,0,0,.4);margin-bottom:16px;border:2px solid rgba(255,255,255,.08);position:relative;z-index:1}
.header-status{display:flex;align-items:center;gap:5px;font-size:10px;color:#34D399;font-weight:600;background:rgba(52,211,153,.1);padding:4px 10px;border-radius:100px;border:1px solid rgba(52,211,153,.15)}
.header-status::before{content:'';width:6px;height:6px;background:#34D399;border-radius:50%;animation:pulse 2s infinite}
.header h1{font-size:28px;font-weight:800;color:#fff;line-height:1.12;position:relative;z-index:1}
.header h1 .accent{color:var(--primary-l)}
.header .subtitle{color:rgba(255,255,255,.4);font-size:12px;margin-top:10px;position:relative;z-index:1;letter-spacing:1px;text-transform:uppercase;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500}
.header-page-title{font-size:22px;font-weight:800;color:#fff;position:relative;z-index:1}
.header-back{background:var(--glass);backdrop-filter:blur(12px);border-radius:12px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;z-index:1;flex-shrink:0;color:#fff;border:1px solid rgba(255,255,255,.06);transition:all .15s}
.header-back:active{transform:scale(.9);background:rgba(255,255,255,.16)}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:-14px 14px 24px;position:relative;z-index:10}
.stat{background:var(--surface);padding:16px 8px;text-align:center;border-radius:var(--r);box-shadow:var(--shadow)}
.stat-n{font-family:'Bricolage Grotesque';font-size:26px;font-weight:800;color:var(--primary)}
.stat-l{font-size:9px;color:var(--text3);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}

/* ===== SECTION ===== */
.section{padding:0 14px;margin-bottom:28px}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-hd h2{font-size:18px;font-weight:800}
.section-hd a{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}

/* ===== GRID ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-card{background:var(--surface);border-radius:var(--r);padding:18px 14px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;transition:transform .15s var(--ease)}
.grid-card:active{transform:scale(.96)}
.grid-card-badge{position:absolute;top:8px;right:8px;background:var(--primary);color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-radius:8px}
.grid-card-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:10px}
.grid-card h3{font-size:13.5px;font-weight:700}
.grid-card p{font-size:10.5px;color:var(--text3);margin-top:2px}

/* ===== JOB CARD ===== */
.job-card{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;transition:transform .15s var(--ease)}
.job-card:active{transform:scale(.98)}
.job-logo{width:44px;height:44px;border-radius:12px;flex-shrink:0;object-fit:cover}
.job-info{flex:1;min-width:0}
.job-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-meta{font-size:11px;color:var(--text3);margin-top:2px}
.badge{font-size:9.5px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap}

/* ===== CTA ===== */
.cta-block{margin:0 14px 28px;border-radius:var(--r2);padding:24px 22px;cursor:pointer;position:relative;overflow:hidden}
.cta-red{background:linear-gradient(135deg,var(--primary),var(--primary-d));box-shadow:0 8px 32px rgba(220,38,38,.2)}
.cta-red::before{content:'';position:absolute;top:-30px;right:-30px;width:140px;height:140px;background:rgba(255,255,255,.06);border-radius:50%}
.cta-block h3{font-size:16px;font-weight:800;color:#fff;margin-bottom:6px;position:relative;z-index:1}
.cta-block p{color:rgba(255,255,255,.5);font-size:12px;margin-bottom:16px;position:relative;z-index:1}
.cta-block button{background:#fff;color:var(--primary);border-radius:12px;padding:12px 22px;font-size:13px;font-weight:700;position:relative;z-index:1}

/* ===== COMMUNITY ===== */
.community{margin:0 14px 28px;background:var(--surface);border-radius:var(--r2);padding:22px;box-shadow:var(--shadow)}
.community h3{font-size:16px;font-weight:800;margin-bottom:12px}
.community-avatars{display:flex;margin-bottom:12px}
.community-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;margin-left:-8px;border:2.5px solid var(--bg)}
.community-av:first-child{margin-left:0}
.community p{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:14px}
.community button{display:inline-flex;align-items:center;gap:6px;background:var(--bg);color:var(--accent-d);border-radius:12px;padding:11px 18px;font-size:12px;font-weight:700}

/* ===== ACTU CARDS ===== */
.actu-hero{background:var(--surface);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow2);margin-bottom:14px;cursor:pointer;transition:transform .15s var(--ease)}
.actu-hero:active{transform:scale(.98)}
.actu-hero-img{width:100%;height:180px;object-fit:cover}
.actu-hero-body{padding:16px 18px 18px}
.actu-hero-tag{display:inline-block;font-size:10px;font-weight:700;padding:4px 10px;border-radius:8px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px}
.actu-hero h3{font-size:17px;font-weight:800;line-height:1.3;margin-bottom:5px}
.actu-hero p{font-size:12px;color:var(--text2);line-height:1.5}
.actu-hero-date{font-size:11px;color:var(--text3);margin-top:10px}

.actu-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:flex;gap:0;cursor:pointer;margin-bottom:10px;transition:transform .15s var(--ease);overflow:hidden}
.actu-card:active{transform:scale(.98)}
.actu-card-thumb{width:90px;min-height:90px;flex-shrink:0;object-fit:cover}
.actu-card-body{flex:1;min-width:0;padding:14px}
.actu-card-tag{font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.actu-card h4{font-size:12.5px;font-weight:700;line-height:1.35;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.actu-card p{font-size:10.5px;color:var(--text3)}

/* ===== ACTU FILTERS ===== */
.actu-filters{display:flex;gap:6px;overflow-x:auto;padding:0 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.actu-filters::-webkit-scrollbar{display:none}
.actu-filter{flex-shrink:0;padding:7px 14px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;background:var(--surface);color:var(--text2);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.actu-filter.active{background:var(--dark);color:#fff;box-shadow:0 2px 8px rgba(11,17,33,.2)}

/* ===== ASTUCE CARD ===== */
.astuce-card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s var(--ease)}
.astuce-card:active{transform:scale(.96)}
.astuce-card-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:10px}
.astuce-card h3{font-size:12px;font-weight:700;line-height:1.35;margin-bottom:6px}

/* ===== FORMATION CARD ===== */
.formation-card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;transition:transform .15s var(--ease);border-left:3px solid var(--accent)}
.formation-card:active{transform:scale(.98)}
.formation-card h3{font-size:15px;font-weight:800;margin-bottom:6px}
.formation-meta{display:flex;gap:10px;font-size:11.5px;color:var(--text2);margin-bottom:10px;flex-wrap:wrap}
.progress-bar{flex:1;height:5px;background:var(--bg2);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .6s var(--ease)}
.formation-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.formation-prix{font-size:20px;font-weight:800;color:var(--accent-d)}
.formation-btn{background:var(--dark);color:#fff;border-radius:10px;padding:9px 16px;font-size:12px;font-weight:700}

/* ===== VALEUR CARD ===== */
.valeur-card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:10px}
.valeur-card-ico{font-size:26px;margin-bottom:6px}
.valeur-card h3{font-size:15px;font-weight:800;margin-bottom:5px}
.valeur-card p{font-size:12.5px;color:var(--text2);line-height:1.6}

/* ===== INFO BOX ===== */
.info-box{border-radius:var(--r);padding:16px;margin-top:10px}
.info-box strong{display:block;font-size:13px;margin-bottom:4px}
.info-box p{font-size:12px;line-height:1.55}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(11,17,33,.6);backdrop-filter:blur(8px)}
.modal-content{position:relative;width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;padding:8px 20px max(20px,env(safe-area-inset-bottom));max-height:85dvh;overflow-y:auto;animation:slideU .35s var(--ease)}
.modal-handle{width:36px;height:4px;background:var(--bg2);border-radius:4px;margin:8px auto 16px}
.modal-close{position:absolute;top:14px;right:16px;background:var(--bg);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--text2)}
.modal-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.modal-section{background:var(--bg);border-radius:var(--r3);padding:14px;margin-bottom:8px}
.modal-section-label{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.modal-btn{width:100%;padding:15px;border-radius:var(--r3);font-size:14px;font-weight:700;color:#fff;margin-top:12px}

/* ===== iOS TUTO ===== */
.ios-tuto{margin:0 14px 28px;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:none}
.ios-tuto.show{display:block}
.ios-tuto h3{font-size:14px;font-weight:800;margin-bottom:8px}
.ios-tuto ol{padding-left:18px;font-size:12px;color:var(--text2);line-height:2}
.ios-tuto .close-tuto{background:none;color:var(--text3);font-size:12px;font-weight:600;margin-top:8px;padding:0}

/* ===== BOTTOM NAV ===== */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.04);display:flex;padding:2px 2px max(2px,env(safe-area-inset-bottom));z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 6px;cursor:pointer;color:var(--text3);transition:color .2s;position:relative}
.nav-item.active{color:var(--primary)}
.nav-item.active::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2.5px;background:var(--primary);border-radius:0 0 4px 4px}
.nav-item span{font-size:18px;line-height:1;margin-bottom:1px}
.nav-item small{font-size:9px;font-weight:600}

.page-content{padding-bottom:calc(var(--nav-h) + 8px)}

/* ===== ANIMATIONS ===== */
@keyframes slideD{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideU{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s var(--ease) both}
.fd1{animation-delay:.05s}.fd2{animation-delay:.1s}.fd3{animation-delay:.15s}.fd4{animation-delay:.2s}.fd5{animation-delay:.25s}
</style>
</head>

    ${logo?`<img class="job-logo" src="${logo}" alt="${j.org}">`:`<div style="width:44px;height:44px;border-radius:12px;background:${j.tagColor}12;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${j.icon}</div>`}
    <div class="job-info"><div class="job-title">${j.title}</div><div class="job-meta">${j.org} · ${j.type}</div></div>
    <span class="badge" style="background:${j.tagColor}12;color:${j.tagColor}">${j.tag}</span>
  </div>`;
}

function openModal(html){$('modalContent').innerHTML=`<div class="modal-handle"></div><div class="modal-close" onclick="closeModal()">✕</div>${html}`;$('modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){$('modal').classList.remove('open');document.body.style.overflow=''}
$('modalBg').addEventListener('click',closeModal);

function openJob(id){
  const j=JOBS.find(x=>x.id===id);if(!j)return;
  const logo=ORG_LOGOS[j.org]||'';
  openModal(`
    ${logo?`<img src="${logo}" style="width:52px;height:52px;border-radius:14px;margin-bottom:12px">`:`<div style="font-size:40px;margin-bottom:12px">${j.icon}</div>`}
    <h2 style="font-size:20px;font-weight:800;margin-bottom:4px">${j.title}</h2>
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px">${j.org}</p>
    <div class="modal-badges"><span class="badge" style="background:${j.tagColor}12;color:${j.tagColor}">${j.tag}</span><span class="badge" style="background:#EFF6FF;color:var(--accent-d)">📍 ${j.lieu}</span><span class="badge" style="background:#EFF6FF;color:var(--accent-d)">📅 ${j.date}</span></div>
    <p style="font-size:13.5px;line-height:1.7;margin-bottom:16px">${j.desc}</p>
    <div class="modal-section"><div class="modal-section-label">Contact recruteur</div><div style="font-size:14px;font-weight:600;color:var(--accent-d)">${j.contact}</div></div>
    <a href="mailto:${j.contact}?subject=Candidature%20${encodeURIComponent(j.title)}%20-%20CAPEDUC"><button class="modal-btn" style="background:var(--primary)">Envoyer ma candidature →</button></a>
    <a href="tel:0344481681"><button style="width:100%;margin-top:8px;padding:13px;background:var(--bg);border:1px solid #E2E8F0;border-radius:var(--r3);font-size:13px;font-weight:600;color:var(--text);cursor:pointer">📞 Appeler la Ligue 60</button></a>
  `);
}

function openActu(id){
  const a=ACTUS.find(x=>x.id===id);if(!a)return;
  openModal(`
    <img src="${ACTU_IMGS[a.id]}" style="width:calc(100% + 44px);margin:-16px -22px 16px;height:160px;object-fit:cover;border-radius:0">
    <span class="badge" style="background:${a.color}12;color:${a.color}">${a.cat}</span>
    <span style="font-size:11px;color:var(--text3);margin-left:8px">📅 ${a.date}</span>
    <h2 style="font-size:19px;font-weight:800;margin:10px 0 14px;line-height:1.3">${a.title}</h2>
    <div style="font-size:13.5px;line-height:1.75;color:var(--text2);background:var(--bg);border-radius:var(--r);padding:16px">${a.full}</div>
    <button class="modal-btn" style="background:var(--dark)" onclick="closeModal()">Fermer</button>
  `);
}

function openAstuce(id){
  const a=ASTUCES.find(x=>x.id===id);if(!a)return;
  openModal(`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><div style="width:46px;height:46px;border-radius:13px;background:${a.color}12;display:flex;align-items:center;justify-content:center;font-size:24px">${a.icon}</div><span class="badge" style="background:${a.color}12;color:${a.color}">${a.cat}</span></div>
    <h2 style="font-size:19px;font-weight:800;margin-bottom:14px;line-height:1.3">${a.title}</h2>
    <div style="font-size:13.5px;line-height:1.75;white-space:pre-line;background:var(--bg);border-radius:var(--r);padding:16px">${a.content}</div>
    <button class="modal-btn" style="background:${a.color}" onclick="closeModal()">Compris ✓</button>
  `);
}

function openFormation(id){
  const f=FORMATIONS.find(x=>x.id===id);if(!f)return;
  const pct=((f.total-f.places)/f.total*100);const col=f.places<6?'var(--rose)':'var(--green)';
  openModal(`
    <h2 style="font-size:20px;font-weight:800;margin-bottom:8px">${f.title}</h2>
    <div class="modal-badges"><span class="badge" style="background:#EFF6FF;color:var(--accent-d)">📅 ${f.dates}</span><span class="badge" style="background:#EFF6FF;color:var(--accent-d)">📍 ${f.lieu}</span></div>
    <p style="font-size:13.5px;line-height:1.7;margin-bottom:14px">${f.desc}</p>
    <div class="modal-section"><div class="modal-section-label">Places disponibles</div><div style="display:flex;align-items:center;gap:10px;margin-top:6px"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${col}"></div></div><span style="font-size:14px;font-weight:700;color:${col}">${f.places}/${f.total}</span></div></div>
    <div class="modal-section"><div class="modal-section-label">Aides financières</div><p style="font-size:12.5px;line-height:1.6;margin-top:4px">${f.aides}</p></div>
    <div class="modal-section" style="background:#FEF2F2;border:1px solid #FECACA"><div class="modal-section-label" style="color:var(--primary)">⚠️ Avant de t'inscrire</div><p style="font-size:12.5px;line-height:1.6;margin-top:4px">Pré-inscription obligatoire sur le site du Ministère.</p><a href="${CONTACT.preinscription}" target="_blank" style="display:inline-block;margin-top:6px;background:rgba(220,38,38,.08);color:var(--primary);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700">Pré-inscription Ministère →</a></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px"><div style="font-size:26px;font-weight:800;color:var(--accent-d)">${f.prix}</div><span style="font-size:11px;color:var(--text3)">avant aides</span></div>
    <a href="${f.url}" target="_blank"><button class="modal-btn" style="background:var(--accent)">S'inscrire sur bafa.laligue60.fr →</button></a>
    <div style="display:flex;gap:6px;margin-top:8px"><a href="mailto:${CONTACT.email}" style="flex:1"><button style="width:100%;padding:11px;background:var(--bg);border:1px solid #E2E8F0;border-radius:10px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer">✉️ ${CONTACT.email}</button></a><a href="tel:${CONTACT.tel.replace(/ /g,'')}"><button style="padding:11px 14px;background:var(--bg);border:1px solid #E2E8F0;border-radius:10px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer">📞</button></a></div>
  `);
}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBanner').classList.remove('hidden')});
$('installBtn').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}$('installBanner').classList.add('hidden')});
$('installClose').addEventListener('click',()=>{$('installBanner').classList.add('hidden')});
if(window.matchMedia('(display-mode:standalone)').matches||navigator.standalone){$('installBanner').classList.add('hidden')}
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
if(isIOS&&!navigator.standalone){setTimeout(()=>{const t=document.getElementById('iosTuto');if(t)t.classList.add('show')},2000)}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
window.addEventListener('online',()=>document.body.classList.remove('offline'));
window.addEventListener('offline',()=>document.body.classList.add('offline'));
const urlPage=new URLSearchParams(window.location.search).get('page');
if(urlPage&&['emplois','astuces','formations','valeurs','actus'].includes(urlPage)){navigate(urlPage)}else{navigate('home')}
</script>
</body>
</html>
